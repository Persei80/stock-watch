<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Watch</title>
  <meta name="description" content="Real-time stock watchlist">
  <meta name="theme-color" content="#0b0f14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" width="28" height="28" alt="">
      <h1 data-i18n="title">Stock Watch</h1>
    </div>
    <div class="status">
      <span id="market-status" class="pill" hidden></span>
      <span id="conn-status" class="pill conn"><span class="dot"></span><span class="label"></span></span>
    </div>
    <div class="actions">
      <button id="install" type="button" class="btn primary" data-i18n="install" hidden>Install app</button>
      <a id="help" class="help-btn" href="help.html" target="_blank" rel="noopener" data-i18n-title="help" title="Help">?</a>
      <select id="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="he">HE</option>
      </select>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <form id="add-form" class="add-form" autocomplete="off">
        <div class="search-wrap">
          <input id="add-input" type="text" spellcheck="false" data-i18n-placeholder="addPlaceholder" aria-autocomplete="list" aria-controls="suggestions">
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="submit" class="btn primary" data-i18n="add"></button>
      </form>
      <div class="toolbar-right">
        <label class="sort">
          <span data-i18n="sortBy"></span>
          <select id="sort">
            <option value="manual" data-i18n="sortManual"></option>
            <option value="change-desc" data-i18n="sortGainers"></option>
            <option value="change-asc" data-i18n="sortLosers"></option>
            <option value="symbol" data-i18n="sortSymbol"></option>
          </select>
        </label>
        <button type="button" id="reset-list" class="link-btn small" data-i18n="resetList"></button>
        <span id="updated" class="muted small"></span>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty muted" data-i18n="empty" hidden></p>
  </main>

  <div id="toast" class="toast" role="status" hidden>
    <span class="msg"></span>
    <button type="button" class="undo" hidden></button>
  </div>

  <dialog id="detail" class="detail" aria-labelledby="detail-symbol">
    <div class="detail-body">
      <div class="detail-head">
        <div>
          <div id="detail-symbol" class="detail-symbol" dir="ltr"></div>
          <div class="detail-name muted" dir="auto"></div>
        </div>
        <button type="button" class="detail-close" data-i18n-title="close" aria-label="Close">&times;</button>
      </div>
      <div class="detail-quote">
        <span class="detail-price" dir="ltr"></span>
        <span class="detail-change" dir="ltr"></span>
        <span class="detail-period muted"></span>
      </div>
      <div class="detail-ext ext small" hidden>
        <span class="ext-label muted"></span>
        <span class="ext-price" dir="ltr"></span>
        <span class="ext-change" dir="ltr"></span>
      </div>
      <div class="ranges" role="tablist"></div>
      <div class="chart-wrap">
        <svg id="chart" aria-hidden="true"></svg>
        <div class="chart-tip" hidden><span class="tip-price" dir="ltr"></span><span class="tip-time muted"></span></div>
        <p class="chart-msg muted" hidden></p>
      </div>
      <dl class="detail-stats"></dl>
    </div>
  </dialog>

  <template id="card-tpl">
    <article class="card" tabindex="0">
      <button type="button" class="remove" aria-label="Remove">&times;</button>
      <div class="card-head">
        <div class="logo"></div>
        <div class="ident">
          <div class="symbol" dir="ltr"></div>
          <div class="name muted" dir="auto"></div>
        </div>
      </div>
      <div class="price-row">
        <span class="price" dir="ltr">—</span>
        <span class="change" dir="ltr"></span>
        <span class="delayed pill small" data-i18n="delayed" hidden></span>
      </div>
      <div class="ext small" hidden>
        <span class="ext-label muted"></span>
        <span class="ext-price" dir="ltr"></span>
        <span class="ext-change" dir="ltr"></span>
      </div>
      <svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
        <line class="base" x1="0" x2="100" y1="16" y2="16"></line>
        <polyline class="line" points=""></polyline>
      </svg>
      <div class="range" dir="ltr">
        <div class="range-bar"><span class="range-mark"></span></div>
        <div class="range-labels muted small"><span class="low"></span><span class="high"></span></div>
      </div>
      <dl class="stats small">
        <div><dt class="muted" data-i18n="open"></dt><dd class="open" dir="ltr">—</dd></div>
        <div><dt class="muted" data-i18n="prevClose"></dt><dd class="pc" dir="ltr">—</dd></div>
      </dl>
      <button type="button" class="chart-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="chart"></span>
      </button>
    </article>
  </template>

  <script src="i18n.js"></script>
  <script src="detail.js"></script>
  <script src="app.js"></script>
</body>
</html>
